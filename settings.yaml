apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-sky-blog-2-setting
spec:
  forms:
    - group: appearance
      label: 外观设置
      formSchema:
        - $formkit: toggle
          id: color_preset_selector
          name: color_preset
          label: 终端配色方案
          render-type: image
          size: 100
          gap: 15
          help: "选择内置色彩配置以全局覆盖。如果选择\u201c完全自定义\u201d，请在下方手动指定颜色。"
          value: classic_green
          options:
            - label: 经典骇客
              value: classic_green
              render: data:image/svg+xml;base64,
            - label: 复古琥珀
              value: amber
              render: data:image/svg+xml;base64,
            - label: 深海科技
              value: phosphor_blue
              render: data:image/svg+xml;base64,
            - label: 赛博朋克
              value: cyberpunk
              render: data:image/svg+xml;base64,
            - label: 警报控制
              value: alert_blood
              render: data:image/svg+xml;base64,
            - label: 完全自定义
              value: custom
              render: data:image/svg+xml;base64,
        - $formkit: color
          id: custom_primary_color
          name: custom_primary_color
          label: 自定义主色调 (Primary Text)
          value: "#00ff00"
          if: $get(color_preset_selector).value === 'custom'
          help: "仅当配色方案选为\u201c完全自定义\u201d时生效"
        - $formkit: color
          id: custom_bg_color
          name: custom_bg_color
          label: 自定义背景色 (Background)
          value: "#0d0d0d"
          if: $get(color_preset_selector).value === 'custom'
          help: "仅当配色方案选为\u201c完全自定义\u201d时生效"
        - $formkit: checkbox
          id: enable_scanline
          name: enable_scanline
          label: CRT 扫描线效果
          value: true
          help: 模拟老式 CRT 显示器的扫描线，关闭可提升低性能设备流畅度
        - $formkit: checkbox
          id: enable_flicker
          name: enable_flicker
          label: CRT 闪烁动画
          value: true
          help: 模拟显示器微弱闪烁，部分用户对闪烁敏感可关闭
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          id: ascii_title_text
          name: ascii_title_text
          label: ASCII 艺术字文本
          placeholder: 例如：SkyBlog
          help: 输入要显示的文字，将自动生成 ASCII 艺术字
        - $formkit: select
          id: ascii_font
          name: ascii_font
          label: ASCII 艺术字风格
          value: Standard
          options:
            - label: Standard (标准)
              value: Standard
            - label: Banner (横幅)
              value: Banner
            - label: Big (大号)
              value: Big
            - label: Block (块状)
              value: Block
            - label: Doom (末日)
              value: Doom
            - label: Lean (倾斜)
              value: Lean
            - label: Mini (迷你)
              value: Mini
            - label: Script (手写)
              value: Script
            - label: Shadow (阴影)
              value: Shadow
            - label: Slant (斜体)
              value: Slant
            - label: Small (小号)
              value: Small
            - label: Speed (速度)
              value: Speed
    - group: features
      label: 功能开关
      formSchema:
        - $formkit: checkbox
          id: show_search
          name: show_search
          label: 显示搜索按钮
          value: true
          help: 在页脚显示 [SEARCH] 按钮（需安装搜索插件）
        - $formkit: checkbox
          id: show_comments
          name: show_comments
          label: 显示评论组件
          value: false
          help: 在文章页显示 Halo 评论扩展点（需安装并启用官方评论组件 PluginCommentWidget）
        - $formkit: checkbox
          id: show_login
          name: show_login
          label: 显示登录入口
          value: true
          help: 在顶部 Header 显示 [LOGIN] / [LOGOUT] 用户信息
        - $formkit: checkbox
          id: show_header
          name: show_header
          label: 显示顶部 Header
          value: true
          help: 显示 ASCII Art 标题栏和用户信息栏
        - $formkit: checkbox
          id: show_scrollbar
          name: show_scrollbar
          label: 显示滚动条
          value: false
          help: 在内容区域显示终端风格滚动条
        - $formkit: checkbox
          id: show_ls_simulation
          name: show_ls_simulation
          label: 显示首页命令模拟行
          value: true
          help: 首页显示 "ls -la ./posts" 打字动画行
        - $formkit: checkbox
          id: show_pinned_folders
          name: show_pinned_folders
          label: 显示首页置顶目录
          value: true
          help: 首页显示 categories/、tags/、../ 三个置顶条目
        - $formkit: checkbox
          id: compact_mode
          name: compact_mode
          label: 紧凑模式
          value: false
          help: 移除外层 padding，最大化内容显示区域
    - group: footer
      label: 页脚设置
      formSchema:
        - $formkit: text
          id: icp
          name: icp
          label: ICP 备案号
          placeholder: 例如：京ICP备00000000号
        - $formkit: text
          id: police_icp
          name: police_icp
          label: 公安联网备案号
          placeholder: 例如：京公网安备00000000000000号
        - $formkit: code
          id: custom_head
          name: custom_head
          label: 自定义底部代码
          placeholder: 可用于添加统计代码等，将直接注入到 body 底部
          help: 仅粘贴可信管理员代码，将直接注入到 body 底部。
          language: html
          height: 180px
    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: checkbox
          id: debug_mode
          name: debug_mode
          label: 开发者调试模式
          value: false
          help: 启用后在浏览器控制台输出主题调试日志（仅开发者使用）
