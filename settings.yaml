apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-sky-blog-2-setting
spec:
  forms:
    - group: color
      label: 配色方案
      formSchema:
        - $formkit: toggle
          id: color_preset_selector
          name: color_preset
          label: 终端配色方案
          render-type: image
          size: 100
          gap: 15
          help: 选择内置色彩配置以全局覆盖。如果选择"完全自定义"，请在下方手动指定颜色。
          value: classic_green
          options:
            - label: 经典骇客
              value: classic_green
              render: data:image/svg+xml;base64,
            - label: 复古琥珀
              value: amber
              render: data:image/svg+xml;base64,
            - label: 深海科技
              value: phosphor_blue
              render: data:image/svg+xml;base64,
            - label: 赛博朋克
              value: cyberpunk
              render: data:image/svg+xml;base64,
            - label: 警报控制
              value: alert_blood
              render: data:image/svg+xml;base64,
            - label: 完全自定义
              value: custom
              render: data:image/svg+xml;base64,
        - $formkit: color
          name: custom_primary_color
          label: 自定义主色调 (Primary Text)
          value: "#00ff00"
          if: $get(color_preset_selector).value === 'custom'
          help: 仅当配色方案选为"完全自定义"时生效
        - $formkit: color
          name: custom_bg_color
          label: 自定义背景色 (Background)
          value: "#0d0d0d"
          if: $get(color_preset_selector).value === 'custom'
          help: 仅当配色方案选为"完全自定义"时生效
    - group: effects
      label: 特效设置
      formSchema:
        - $formkit: checkbox
          name: enable_scanline
          label: CRT 扫描线效果
          value: true
          help: 模拟老式 CRT 显示器的扫描线，关闭可提升低性能设备流畅度
        - $formkit: checkbox
          name: enable_flicker
          label: CRT 闪烁动画
          value: true
          help: 模拟显示器微弱闪烁，部分用户对闪烁敏感可关闭
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: ascii_title_text
          label: ASCII 艺术字文本
          placeholder: 例如：SkyBlog
          help: 输入要显示的文字，将自动生成 ASCII 艺术字
        - $formkit: select
          name: ascii_font
          label: ASCII 艺术字风格
          value: Standard
          options:
            - label: Standard (标准)
              value: Standard
            - label: Banner (横幅)
              value: Banner
            - label: Big (大号)
              value: Big
            - label: Block (块状)
              value: Block
            - label: Doom (末日)
              value: Doom
            - label: Lean (倾斜)
              value: Lean
            - label: Mini (迷你)
              value: Mini
            - label: Script (手写)
              value: Script
            - label: Shadow (阴影)
              value: Shadow
            - label: Slant (斜体)
              value: Slant
            - label: Small (小号)
              value: Small
            - label: Speed (速度)
              value: Speed
    - group: footer
      label: 页脚设置
      formSchema:
        - $formkit: text
          name: icp
          label: ICP 备案号
          placeholder: 例如：京ICP备00000000号
        - $formkit: text
          name: police_icp
          label: 公安联网备案号
          placeholder: 例如：京公网安备00000000000000号
        - $formkit: textarea
          name: custom_head
          label: 自定义头部代码
          placeholder: 可用于添加统计代码等，将直接注入到 body 底部
          rows: 5
