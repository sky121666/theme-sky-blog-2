<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="px-2 md:px-0" x-data="fileListNav">
      <!-- Command Input Simulation -->
      <div class="text-terminal-green mb-6 flex items-center gap-2">
        <span class="text-terminal-dim" th:if="${#authentication.name == 'anonymousUser'}"
          >guest@<span th:text="${site.title}"></span>:~/blog/tags/<span th:text="${tag.spec.slug}"></span>$</span
        >
        <span
          class="text-terminal-dim"
          th:if="${#authentication.name != 'anonymousUser'}"
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
        >
          <span th:text="${currentUser.name}"></span>@<span th:text="${site.title}"></span>:~/blog/tags/<span
            th:text="${tag.spec.slug}"
          ></span
          >$
        </span>
        <span class="typing-effect" x-data="typewriter('ls -la', 50)" x-text="display"></span>
      </div>

      <!-- Tag Info Header -->
      <div class="border-terminal-dim bg-terminal-green/20 mb-4 border p-3 text-xs">
        <span class="text-terminal-dim">Tag:</span>
        <span class="text-terminal-green font-bold">#<span th:text="${tag.spec.displayName}"></span></span>
        <span class="text-terminal-dim ml-4">Posts:</span>
        <span th:text="${posts.total}" class="text-terminal-green"></span>
      </div>

      <!-- File List Header -->
      <div
        class="border-terminal-dim text-terminal-green mb-2 grid grid-cols-12 gap-2 border-b pb-1 text-xs font-bold opacity-80 md:text-sm"
      >
        <div class="col-span-3 md:col-span-2">PERMISSIONS</div>
        <div class="col-span-2 hidden md:block">USER</div>
        <div class="col-span-3 md:col-span-2">DATE</div>
        <div class="col-span-6">NAME</div>
      </div>

      <!-- File List -->
      <ul class="space-y-1 font-mono text-xs md:text-sm">
        <!-- Parent Directory Link -->
        <li
          data-nav-item
          :class="{ '!bg-terminal-green !text-terminal-black': selectedIndex === 0 }"
          th:with="tagPermalink=${tag.status.permalink != null ? tag.status.permalink : '/tags'},
                         tagPermalinkClean=${tagPermalink.endsWith('/') ? tagPermalink.substring(0, tagPermalink.length() - 1) : tagPermalink},
                         tagSlug=${tag.spec.slug != null ? tag.spec.slug : ''},
                         tagRootUrl=${tagSlug != '' and tagPermalinkClean.endsWith('/' + tagSlug) ? tagPermalinkClean.substring(0, tagPermalinkClean.length() - tagSlug.length() - 1) : '/tags'}"
          class="text-terminal-green hover:bg-terminal-green hover:text-terminal-black grid cursor-pointer grid-cols-12 gap-2 px-1 transition-colors"
        >
          <div class="col-span-3 md:col-span-2">drwxr-xr-x</div>
          <div class="col-span-2 hidden md:block">root</div>
          <div
            class="text-terminal-dim col-span-3 md:col-span-2"
            :class="{ '!text-terminal-black': selectedIndex === 0 }"
          >
            ...
          </div>
          <div class="col-span-6">
            <a th:href="${tagRootUrl}" class="block w-full text-inherit">../</a>
          </div>
        </li>

        <!-- Posts Loop -->
        <li
          th:each="post,iterStat : ${posts.items}"
          data-nav-item
          th:data-index="${iterStat.count}"
          :class="{ '!bg-terminal-green !text-terminal-black': selectedIndex === $el.dataset.index * 1 }"
          class="group text-terminal-green hover:bg-terminal-green hover:text-terminal-black grid cursor-pointer grid-cols-12 gap-2 px-1 transition-colors"
        >
          <div
            class="col-span-3 font-mono opacity-70 group-hover:opacity-100 md:col-span-2"
            th:with="canEdit=${#authentication.name == post.spec.owner}"
          >
            <span th:text="${canEdit ? '-rwxr-xr-x' : '-rw-r--r--'}"></span>
          </div>
          <div class="col-span-2 hidden opacity-70 group-hover:opacity-100 md:block" th:text="${post.spec.owner}">
            user
          </div>
          <div
            class="col-span-3 opacity-70 group-hover:opacity-100 md:col-span-2"
            th:text="${#dates.format(post.spec.publishTime, 'MMM dd HH:mm')}"
          >
            Jan 01 00:00
          </div>
          <div class="col-span-6 truncate">
            <a th:href="${post.status.permalink}" th:text="${post.spec.title}" class="block w-full text-inherit"
              >Post Title</a
            >
          </div>
        </li>
      </ul>

      <!-- Pagination -->
      <div class="mt-8 flex gap-4 text-sm" th:if="${posts.hasPrevious() || posts.hasNext()}">
        <a
          th:if="${posts.hasPrevious()}"
          th:href="${posts.prevUrl}"
          class="text-terminal-green hover:bg-terminal-green hover:text-terminal-black border-terminal-green border px-2 transition-colors"
          data-nav-item
          th:data-index="${#lists.size(posts.items) + 1}"
          :class="{ '!bg-terminal-green !text-terminal-black': selectedIndex === $el.dataset.index * 1 }"
        >
          &lt; PREV
        </a>
        <a
          th:if="${posts.hasNext()}"
          th:href="${posts.nextUrl}"
          class="text-terminal-green hover:bg-terminal-green hover:text-terminal-black border-terminal-green border px-2 transition-colors"
          data-nav-item
          th:data-index="${#lists.size(posts.items) + (posts.hasPrevious() ? 2 : 1)}"
          :class="{ '!bg-terminal-green !text-terminal-black': selectedIndex === $el.dataset.index * 1 }"
        >
          NEXT &gt;
        </a>
      </div>

      <!-- Total Files Footer -->
      <div class="text-terminal-dim mt-4 text-xs"><span th:text="${posts.total}">0</span> files found.</div>
    </div>
  </th:block>
</html>
