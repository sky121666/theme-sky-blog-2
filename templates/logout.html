<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{gateway_fragments/layout :: layout(title = 'Confirm Logout - ' + ${site.title}, head = ~{::head}, body = ~{::body}, pageType = 'logout')}"
>
  <head>
    <style>
      .logout-page-wrapper {
        max-width: 32em;
      }

      /* 覆盖 main.css 中 .auth-form-terminal button 的 !important 样式 */
      .auth-form-terminal .logout-btn {
        margin-top: 0 !important;
        padding: 0.75rem 1rem !important;
        width: auto !important;
        flex: 1 !important;
      }
    </style>
  </head>
  <th:block th:fragment="body">
    <div class="terminal-login-wrapper logout-page-wrapper w-full">
      <!-- The Form Container -->
      <div class="terminal-form-box">
        <div class="mb-6 text-center">
          <p class="text-terminal-green mb-2">> Confirming termination of active session.</p>
          <div class="flex items-center justify-center gap-2 text-sm">
            <span class="text-terminal-dim">CURRENT_USER:</span>
            <span
              class="text-terminal-green bg-terminal-green/10 border-terminal-green/30 rounded border px-2 py-0.5 font-bold"
              th:text="${#authentication.name}"
              >GUEST</span
            >
          </div>
        </div>

        <!-- The actual logout form logic that posts to /logout -->
        <form th:action="@{/logout}" method="post" class="space-y-6">
          <div
            class="border-terminal-green/30 bg-terminal-green/5 text-terminal-dim mb-6 border p-3 text-center text-xs leading-relaxed"
          >
            WARNING: Execution will forcefully sever connection. Unsaved buffers may be lost. Proceed with operation?
          </div>

          <div class="flex flex-col gap-3 sm:flex-row">
            <!-- Confirm Logout Button -->
            <button
              type="submit"
              class="logout-btn terminal-btn-primary group relative flex items-center justify-center overflow-hidden transition-all duration-300"
            >
              <!-- Holographic scanline effect -->
              <div
                class="via-terminal-black/20 absolute inset-0 -translate-y-full bg-gradient-to-b from-transparent to-transparent transition-transform duration-1000 group-hover:translate-y-full"
              ></div>

              <span
                class="relative z-10 flex items-center justify-center leading-none font-bold tracking-widest whitespace-nowrap"
              >
                <span class="text-terminal-black mr-2 opacity-50 transition-opacity group-hover:opacity-100">[Y]</span>
                CONFIRM
              </span>

              <!-- Decorative corners -->
              <div class="border-terminal-black absolute top-0 left-0 h-2 w-2 border-t-2 border-l-2 opacity-50"></div>
              <div
                class="border-terminal-black absolute right-0 bottom-0 h-2 w-2 border-r-2 border-b-2 opacity-50"
              ></div>
            </button>

            <!-- Cancel / Provide an easy way to go back -->
            <a
              th:href="@{/}"
              class="group border-terminal-green text-terminal-green hover:bg-terminal-green/10 relative flex !h-auto flex-1 items-center justify-center overflow-hidden border px-4 py-3 transition-all duration-300"
            >
              <span
                class="relative z-10 flex items-center justify-center leading-none font-bold tracking-widest whitespace-nowrap"
              >
                <span class="text-terminal-green/50 group-hover:text-terminal-green mr-2 transition-colors">[N]</span>
                ABORT
              </span>

              <!-- Glitch box on hover -->
              <div
                class="border-terminal-green group-hover:animate-flicker absolute inset-0 border opacity-0 group-hover:opacity-100"
              ></div>
            </a>
          </div>
        </form>
      </div>
    </div>
  </th:block>
</html>
