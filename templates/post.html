<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="px-2 md:px-0" x-data="postViewer">
      <!-- Command Input Simulation -->
      <div class="text-terminal-green mb-6 flex items-center gap-2">
        <span class="text-terminal-dim" th:if="${#authentication.name == 'anonymousUser'}"
          >guest@<span th:text="${site.title}"></span>:~/blog$</span
        >
        <span
          class="text-terminal-dim"
          th:if="${#authentication.name != 'anonymousUser'}"
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
        >
          <span th:text="${currentUser.name}"></span>@<span th:text="${site.title}"></span>:~/blog$
        </span>
        <span
          class="typing-effect"
          x-data="typewriter('cat ' + $el.getAttribute('data-filename'), 30)"
          th:data-filename="'&quot;' + ${post.spec.title} + '.md&quot;'"
          x-text="display"
        ></span>
      </div>

      <article class="prose prose-invert max-w-none">
        <!-- Reading Progress -->
        <div class="border-terminal-dim text-terminal-dim mb-4 border border-dashed p-2 font-mono text-xs">
          <div class="mb-1 flex items-center justify-between">
            <span>READ_PROGRESS</span>
            <span><span x-text="readingProgress"></span>%</span>
          </div>
          <div class="bg-terminal-green/10 h-1 overflow-hidden">
            <div class="bg-terminal-green h-full transition-[width]" :style="`width: ${readingProgress}%`"></div>
          </div>
        </div>

        <!-- File Metadata Header -->
        <div
          class="border-terminal-green bg-terminal-green/20 relative mb-8 overflow-hidden border p-4 font-mono text-xs"
        >
          <div class="bg-terminal-green animate-scanline absolute top-0 left-0 h-1 w-full opacity-20"></div>
          <div class="grid grid-cols-2 gap-y-2">
            <div><span class="text-terminal-dim">File:</span> <span th:text="${post.spec.title} + '.md'"></span></div>
            <div>
              <span class="text-terminal-dim">Size:</span>
              <span th:text="${#strings.length(post.content.content)} + ' bytes'"></span>
            </div>
            <div th:with="author = ${contributorFinder.getContributor(post.spec.owner)}">
              <span class="text-terminal-dim">Author:</span>
              <span th:text="${author != null ? author.displayName : post.spec.owner}"></span>
            </div>
            <div>
              <span class="text-terminal-dim">Created:</span>
              <span th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
            </div>
          </div>
        </div>

        <!-- Article TOC -->
        <nav
          x-show="tocItems.length > 0"
          class="border-terminal-dim text-terminal-dim mb-8 border border-dashed p-4 font-mono text-xs"
          aria-label="Article table of contents"
        >
          <div class="text-terminal-green mb-2">[TOC]</div>
          <ol class="space-y-1">
            <template x-for="(item, index) in tocItems" :key="item.id">
              <li :class="{ 'pl-4': item.level > 2 }">
                <button
                  type="button"
                  class="hover:text-terminal-green cursor-pointer bg-transparent p-0 text-left font-mono text-inherit transition-colors"
                  @click="jumpToHeading(item.id)"
                >
                  <span x-text="String(index + 1).padStart(2, '0')"></span>.
                  <span x-text="item.text"></span>
                </button>
              </li>
            </template>
          </ol>
        </nav>

        <!-- Post Content -->
        <div class="terminal-content">
          <h1
            th:text="${post.spec.title}"
            class="border-terminal-green mb-8 border-b-2 border-dashed pb-4 text-3xl"
          ></h1>

          <th:block th:utext="${post.content.content}"> </th:block>
        </div>
      </article>

      <!-- EOF Marker -->
      <div class="text-terminal-dim mt-12 mb-8 animate-pulse text-center">*** END OF FILE ***</div>

      <!-- Comments -->
      <section
        th:if="${theme.config.features?.show_comments == true}"
        class="terminal-comments border-terminal-dim mb-8 border border-dashed p-4"
      >
        <div class="text-terminal-green mb-4 font-mono text-xs">[COMMENTS]</div>
        <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}"></halo:comment>
      </section>

      <!-- Back Button -->
      <div class="mb-8">
        <button
          type="button"
          data-terminal-action="back"
          class="border-terminal-green text-terminal-green hover:bg-terminal-green hover:text-terminal-black cursor-pointer border bg-transparent px-4 py-1 font-mono transition-colors"
        >
          cd ..
        </button>
      </div>
    </div>
  </th:block>
</html>
