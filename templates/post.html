<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="px-2 md:px-0" x-data="postViewer">
      <!-- Command Input Simulation -->
      <div class="text-terminal-green mb-6 flex items-center gap-2">
        <span class="text-terminal-dim" th:if="${#authentication.name == 'anonymousUser'}"
          >guest@<span th:text="${site.title}"></span>:~/blog$</span
        >
        <span
          class="text-terminal-dim"
          th:if="${#authentication.name != 'anonymousUser'}"
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
        >
          <span th:text="${currentUser.name}"></span>@<span th:text="${site.title}"></span>:~/blog$
        </span>
        <span
          class="typing-effect"
          x-data="typewriter('cat ' + $el.getAttribute('data-filename'), 30)"
          th:data-filename="'&quot;' + ${post.spec.title} + '.md&quot;'"
          x-text="display"
        ></span>
      </div>

      <article class="prose prose-invert max-w-none">
        <!-- File Metadata Header -->
        <div
          class="border-terminal-green bg-terminal-green/20 relative mb-8 overflow-hidden border p-4 font-mono text-xs"
        >
          <div class="bg-terminal-green animate-scanline absolute top-0 left-0 h-1 w-full opacity-20"></div>
          <div class="grid grid-cols-2 gap-y-2">
            <div><span class="text-terminal-dim">File:</span> <span th:text="${post.spec.title} + '.md'"></span></div>
            <div>
              <span class="text-terminal-dim">Size:</span>
              <span th:text="${#strings.length(post.content.content)} + ' bytes'"></span>
            </div>
            <div th:with="author = ${contributorFinder.getContributor(post.spec.owner)}">
              <span class="text-terminal-dim">Author:</span>
              <span th:text="${author != null ? author.displayName : post.spec.owner}"></span>
            </div>
            <div>
              <span class="text-terminal-dim">Created:</span>
              <span th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
            </div>
          </div>
        </div>

        <!-- Post Content -->
        <div class="terminal-content">
          <h1
            th:text="${post.spec.title}"
            class="border-terminal-green mb-8 border-b-2 border-dashed pb-4 text-3xl"
          ></h1>

          <th:block th:utext="${post.content.content}"> </th:block>
        </div>
      </article>

      <!-- EOF Marker -->
      <div class="text-terminal-dim mt-12 mb-8 animate-pulse text-center">*** END OF FILE ***</div>

      <!-- Back Button -->
      <div class="mb-8">
        <a
          href="javascript:history.back()"
          class="border-terminal-green text-terminal-green hover:bg-terminal-green hover:text-terminal-black inline-block border px-4 py-1 transition-colors"
        >
          cd ..
        </a>
      </div>
    </div>
  </th:block>
</html>
