<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="terminal-reader" x-data="postViewer">
      <!-- Command Input Simulation -->
      <div class="text-terminal-green mb-2 flex min-w-0 items-baseline gap-2 text-sm md:mb-4 md:text-base">
        <span class="text-terminal-dim hidden min-w-0 break-all md:inline">
          <th:block th:replace="~{modules/layout :: promptHost}" />~/blog<span class="terminal-command-sigil">$</span>
        </span>
        <span
          class="typing-effect min-w-0 break-words"
          x-data="typewriter('cat ' + $el.getAttribute('data-filename'), 30)"
          th:data-filename="'&quot;' + ${post.spec.title} + '.md&quot;'"
          x-text="display"
        ></span>
        <button
          type="button"
          data-terminal-action="source-back"
          th:data-home-url="@{/}"
          class="requires-theme-runtime reader-back hidden shrink-0 items-center md:ml-auto md:inline-flex"
        >
          [BACK]
        </button>
      </div>

      <article class="prose prose-invert max-w-none min-w-0">
        <h1
          th:text="${post.spec.title}"
          class="reader-title border-terminal-green mb-2 border-b-2 border-dashed pb-2 text-2xl break-words md:mb-6 md:pb-4 md:text-3xl"
        ></h1>

        <div class="reader-meta border-terminal-dim mb-2 border-b border-dashed pb-2 font-mono text-xs md:mb-4">
          <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 break-words">
            <span th:with="author = ${contributorFinder.getContributor(post.spec.owner)}">
              Author: <span th:text="${author != null ? author.displayName : post.spec.owner}"></span>
            </span>
            <span
              >Published:
              <time
                th:datetime="${post.spec.publishTime}"
                th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"
              ></time
            ></span>
          </div>
          <div class="requires-theme-runtime mt-2 flex items-center gap-2">
            <span>READ_PROGRESS</span>
            <div class="bg-terminal-green/10 h-1 grow overflow-hidden" aria-hidden="true">
              <div class="bg-terminal-green h-full" :style="`width: ${readingProgress}%`"></div>
            </div>
            <span class="min-w-[4ch] text-right tabular-nums"><span x-text="readingProgress"></span>%</span>
          </div>
        </div>

        <!-- Article TOC -->
        <details
          class="reader-toc requires-theme-runtime border-terminal-dim mb-3 border border-dashed px-3 font-mono text-xs md:mb-5 md:px-4"
          x-show="tocItems.length > 0"
        >
          <summary
            class="text-terminal-green hover:text-terminal-green inline-flex min-h-10 cursor-pointer items-center py-2 md:min-h-0"
            aria-label="Article table of contents"
          >
            <span aria-hidden="true" class="reader-toc-marker"></span> [TOC]
          </summary>
          <nav aria-label="Article table of contents">
            <ol>
              <template x-for="item in tocItems" :key="item.id">
                <li :data-toc-level="item.level">
                  <a
                    :href="'#' + encodeURIComponent(item.id)"
                    class="hover:text-terminal-green inline-flex min-h-10 cursor-pointer items-center bg-transparent p-0 text-left font-mono text-inherit transition-colors md:min-h-0"
                  >
                    <span x-text="item.text"></span>
                  </a>
                </li>
              </template>
            </ol>
          </nav>
        </details>

        <!-- Post Content -->
        <div class="terminal-content max-w-full min-w-0">
          <th:block th:utext="${post.content.content}"> </th:block>
        </div>
      </article>

      <!-- EOF Marker -->
      <div class="text-terminal-dim mt-12 mb-8 text-center">*** END OF FILE ***</div>

      <!-- Comments -->
      <section
        th:if="${theme.config.features?.show_comments == true and haloCommentEnabled}"
        data-navigation-exit="full"
        class="terminal-comments border-terminal-dim mb-8 border border-dashed p-4"
      >
        <h2 class="text-terminal-green mb-4 font-mono text-xs">[COMMENTS]</h2>
        <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}"></halo:comment>
      </section>

      <!-- Return to the source page or move to the virtual parent directory. -->
      <div class="mb-8 flex flex-wrap gap-3">
        <button
          type="button"
          data-terminal-action="source-back"
          th:data-home-url="@{/}"
          class="requires-theme-runtime border-terminal-green text-terminal-green hover:bg-terminal-green hover:text-terminal-black inline-flex min-h-10 cursor-pointer items-center border bg-transparent px-4 py-1 font-mono transition-colors"
        >
          [BACK]
        </button>
        <a
          th:href="@{/}"
          class="border-terminal-green text-terminal-green hover:bg-terminal-green hover:text-terminal-black inline-flex min-h-10 items-center border px-4 py-1 font-mono transition-colors"
        >
          cd ..
        </a>
      </div>
    </div>
  </th:block>
</html>
