<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="terminal-file-list" x-data="fileListNav">
      <h1 class="sr-only" th:text="${site.title}">Blog index</h1>
      <th:block th:if="${theme.config.features?.show_ls_simulation != false}">
        <th:block th:replace="~{modules/file-list :: prompt('~/blog')}"></th:block>
      </th:block>

      <th:block th:replace="~{modules/file-list :: gridHeader('DATE', 'USER')}"></th:block>

      <ul
        th:if="${theme.config.features?.show_pinned_folders != false}"
        class="terminal-file-shortcuts font-mono text-xs md:space-y-1 md:text-sm"
        aria-label="Directories"
      >
        <th:block
          th:each="folder : ${ {'categories/', 'tags/', '../'} }"
          th:with="folderUrl=${folderStat.first ? site.routes.categoriesUri : (folderStat.last ? '/' : site.routes.tagsUri)},
              folderId=${folderStat.first ? 'link-categories' : (folderStat.last ? null : 'link-tags')},
              folderOwner=${folderStat.last or #authentication.name == 'anonymousUser' ? 'root' : #authentication.name}"
        >
          <th:block
            th:replace="~{modules/file-list :: directoryRow(${folderUrl}, ${folder}, ${folderId}, ${folderOwner}, null)}"
          ></th:block>
        </th:block>
      </ul>

      <th:block th:replace="~{modules/file-list :: postList(${posts.items}, true, false)}"></th:block>

      <th:block
        th:replace="~{modules/file-list :: emptyPage(${posts}, '/', 'No posts yet.', 'No posts on this page.')}"
      ></th:block>
      <th:block th:replace="~{modules/file-list :: summary(${posts}, 'Posts pagination', true)}"></th:block>
    </div>
  </th:block>
</html>
