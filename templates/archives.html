<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="px-2 md:px-0" x-data="fileListNav">
      <div class="text-terminal-green mb-3 flex min-w-0 items-center gap-2 md:mb-6">
        <span class="text-terminal-dim min-w-0 truncate" th:if="${#authentication.name == 'anonymousUser'}"
          >guest@<span th:text="${site.title}"></span>:~/blog/archives$</span
        >
        <span class="text-terminal-dim min-w-0 truncate" th:if="${#authentication.name != 'anonymousUser'}">
          <span th:text="${currentUser != null ? currentUser.name : #authentication.name}"></span>@<span
            th:text="${site.title}"
          ></span
          >:~/blog/archives$
        </span>
        <span
          class="typing-effect flex-shrink-0 whitespace-nowrap"
          x-data="typewriter('find ./posts -type f', 35)"
          x-text="display"
        ></span>
      </div>

      <h1 class="border-terminal-green mb-3 border-b-2 border-dashed pb-2 text-xl md:mb-6 md:pb-3 md:text-2xl">
        Archives
      </h1>

      <div
        th:if="${#lists.isEmpty(archives.items)}"
        class="text-terminal-dim border-terminal-dim border border-dashed p-3 md:p-4"
      >
        No archived posts found.
      </div>

      <section th:each="archive : ${archives.items}" class="mb-4 md:mb-8">
        <h2 class="text-terminal-green mb-1 text-lg font-bold md:mb-3 md:text-xl" th:text="|[${archive.year}]|">
          [2026]
        </h2>
        <section th:each="month : ${archive.months}" class="mb-3 md:mb-5">
          <h3 class="text-terminal-dim mb-1 text-sm md:mb-2" th:text="|MONTH ${month.month}|">MONTH 01</h3>
          <ul class="font-mono text-xs md:space-y-1 md:text-sm">
            <li
              th:each="post : ${month.posts}"
              data-nav-item
              data-post-record
              th:data-post-name="${post.metadata.name}"
              th:data-post-created-at="${post.metadata.creationTimestamp}"
              th:data-post-title="${post.spec.title}"
              th:data-post-slug="${post.spec.slug}"
              th:data-post-owner="${post.spec.owner}"
              th:data-post-published-at="${post.spec.publishTime}"
              th:data-post-permalink="${post.status.permalink}"
              :class="{ '!bg-terminal-green !text-terminal-black': isSelected($el) }"
              class="group text-terminal-green hover:bg-terminal-green hover:text-terminal-black grid min-h-10 cursor-pointer grid-cols-[minmax(0,1fr)_auto] items-center gap-x-2 px-1 transition-colors md:min-h-0 md:grid-cols-[8rem_minmax(0,1fr)] md:py-0"
            >
              <time
                class="text-terminal-dim col-start-2 row-start-1 justify-self-end whitespace-nowrap opacity-70 group-hover:opacity-100 md:col-start-1 md:justify-self-auto"
                :class="{ '!text-terminal-black': isSelected($el.closest('[data-nav-item]')) }"
                th:datetime="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"
                th:text="${#dates.format(post.spec.publishTime, 'MM-dd HH:mm')}"
              ></time>
              <a
                th:href="@{${post.status.permalink}}"
                th:text="${post.spec.title}"
                class="col-start-1 row-start-1 flex min-h-10 min-w-0 items-center py-1 break-words text-inherit md:col-start-2 md:block md:min-h-0 md:truncate md:py-0"
                >Post Title</a
              >
            </li>
          </ul>
        </section>
      </section>

      <nav
        th:if="${archives.hasPrevious() || archives.hasNext()}"
        class="mt-4 flex flex-wrap gap-4 text-sm md:mt-8"
        aria-label="Archives pagination"
      >
        <a
          th:if="${archives.hasPrevious()}"
          th:href="@{${archives.prevUrl}}"
          data-nav-item
          :class="{ '!bg-terminal-green !text-terminal-black': isSelected($el) }"
          class="text-terminal-green hover:bg-terminal-green hover:text-terminal-black border-terminal-green inline-flex min-h-10 items-center border px-3 py-2 transition-colors md:min-h-0 md:px-2 md:py-0"
          >&lt; PREV</a
        >
        <a
          th:if="${archives.hasNext()}"
          th:href="@{${archives.nextUrl}}"
          data-nav-item
          :class="{ '!bg-terminal-green !text-terminal-black': isSelected($el) }"
          class="text-terminal-green hover:bg-terminal-green hover:text-terminal-black border-terminal-green inline-flex min-h-10 items-center border px-3 py-2 transition-colors md:min-h-0 md:px-2 md:py-0"
          >NEXT &gt;</a
        >
      </nav>
    </div>
  </th:block>
</html>
