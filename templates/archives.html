<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="terminal-file-list terminal-file-list--lean" x-data="fileListNav">
      <th:block th:replace="~{modules/file-list :: prompt('~/blog/archives')}"></th:block>

      <div class="terminal-list-context"><h1>Archives</h1></div>

      <th:block
        th:replace="~{modules/file-list :: emptyPage(${archives}, ${site.routes.archivesUri}, 'No archived posts found.', 'No archives on this page.')}"
      ></th:block>

      <th:block th:if="${!#lists.isEmpty(archives.items)}">
        <th:block th:replace="~{modules/file-list :: gridHeader('DATE', null)}"></th:block>
      </th:block>

      <section th:each="archive : ${archives.items}" class="mb-4 md:mb-8">
        <h2 class="text-terminal-green mb-1 text-lg font-bold md:mb-3 md:text-xl" th:text="|[${archive.year}]|">
          [2026]
        </h2>
        <section th:each="month : ${archive.months}" class="mb-3 md:mb-5">
          <h3 class="text-terminal-dim mb-1 text-sm md:mb-2" th:text="|MONTH ${month.month}|">MONTH 01</h3>
          <th:block th:replace="~{modules/file-list :: postList(${month.posts}, false)}"></th:block>
        </section>
      </section>

      <th:block th:replace="~{modules/file-list :: summary(${archives}, 'Archives pagination', false)}"></th:block>
    </div>
  </th:block>
</html>
