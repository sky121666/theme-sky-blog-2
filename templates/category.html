<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="terminal-file-list" x-data="fileListNav">
      <th:block th:replace="~{modules/file-list :: prompt(|~/blog/categories/${category.spec.slug}|)}"></th:block>

      <th:block
        th:replace="~{modules/file-list :: context('Category:', ${category.spec.displayName}, ${posts.total})}"
      ></th:block>

      <th:block th:replace="~{modules/file-list :: gridHeader('DATE', 'USER')}"></th:block>

      <th:block th:replace="~{modules/file-list :: parentShortcut(${site.routes.categoriesUri}, 'root')}"></th:block>
      <th:block th:replace="~{modules/file-list :: postList(${posts.items}, true, true)}"></th:block>

      <th:block
        th:replace="~{modules/file-list :: emptyPage(${posts}, ${category.status.permalink}, 'No posts in this category yet.', 'No posts on this page.')}"
      ></th:block>
      <th:block th:replace="~{modules/file-list :: summary(${posts}, 'Category posts pagination', false)}"></th:block>
    </div>
  </th:block>
</html>
