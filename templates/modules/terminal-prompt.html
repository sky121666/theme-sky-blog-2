<!--
  Shared terminal command prompt line.
  Usage: <th:block th:replace="~{modules/terminal-prompt :: prompt(path='~/blog')}" />
  @param path - the terminal path to display (e.g. '~/blog', '~/blog/categories')
-->
<th:block th:fragment="prompt(path)">
  <div class="text-terminal-green mb-6 flex items-center gap-2">
    <span class="text-terminal-dim" th:if="${#authentication.name == 'anonymousUser'}"
      >guest@<span th:text="${site.title}"></span>:<span th:text="${path}">~/blog</span>$</span
    >
    <span
      class="text-terminal-dim"
      th:if="${#authentication.name != 'anonymousUser'}"
      th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
    >
      <span th:text="${currentUser.name}"></span>@<span th:text="${site.title}"></span>:<span th:text="${path}"
        >~/blog</span
      >$
    </span>
  </div>
</th:block>
