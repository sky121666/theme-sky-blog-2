<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="terminal-file-list" x-data="fileListNav">
      <th:block th:replace="~{modules/file-list :: prompt(|~/blog/authors/${author.metadata.name}|)}"></th:block>

      <th:block
        th:replace="~{modules/file-list :: context('Author:', ${author.spec.displayName}, ${posts.total})}"
      ></th:block>

      <th:block th:replace="~{modules/file-list :: gridHeader('DATE', 'USER')}"></th:block>

      <th:block th:replace="~{modules/file-list :: parentShortcut('/', 'root')}"></th:block>
      <th:block th:replace="~{modules/file-list :: postList(${posts.items}, true, true)}"></th:block>

      <th:block
        th:replace="~{modules/file-list :: emptyPage(${posts}, ${author.status.permalink}, 'No posts found.', 'No posts on this page.')}"
      ></th:block>
      <th:block th:replace="~{modules/file-list :: summary(${posts}, 'Author posts pagination', false)}"></th:block>
    </div>
  </th:block>
</html>
