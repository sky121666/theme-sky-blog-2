<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:lang="${#locale.toLanguageTag}"
  th:fragment="html (head, content)"
  class="terminal-theme color-scheme-dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:if="${head == null}" th:text="${site.title}"></title>
    <th:block th:replace="~{modules/runtime-assets :: stylesheet}" />
    <th:block th:replace="~{modules/theme-style :: themeStyle}" />
    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>
  </head>

  <body
    class="flex min-h-screen flex-col font-mono"
    th:with="showHeader=${theme.config.features?.show_header != false}, unixLayout=${theme.config.appearance?.terminal_layout == 'unix'}"
  >
    <a
      href="#plugin-page-content"
      class="focus:bg-terminal-black focus:text-terminal-green sr-only focus:not-sr-only focus:absolute focus:z-50 focus:p-2"
      >Skip to content</a
    >
    <div class="terminal-frame flex flex-1 flex-col">
      <header th:if="${showHeader}" class="terminal-shell-header mb-4 border-b pb-3">
        <div class="min-w-0">
          <a th:href="@{/}" class="text-terminal-green font-bold break-words" th:text="${site.title}"></a>
          <div class="text-terminal-dim mt-1 text-xs">
            <th:block th:replace="~{modules/layout :: promptHost}" />~/blog<span class="terminal-command-sigil">$</span>
          </div>
        </div>
        <div class="terminal-shell-header-meta mt-2 flex flex-wrap gap-x-4 gap-y-2">
          <div th:if="${theme.config.features?.show_login != false}" class="text-terminal-dim text-xs">
            <a th:if="${#authentication.name == 'anonymousUser'}" th:href="@{/login}" class="hover:text-terminal-green"
              >[LOGIN]</a
            >
            <a th:if="${#authentication.name != 'anonymousUser'}" th:href="@{/logout}" class="hover:text-terminal-green"
              >[LOGOUT]</a
            >
          </div>
          <nav
            th:if="${unixLayout}"
            aria-label="Site navigation"
            class="terminal-header-navigation flex-wrap gap-x-4 gap-y-2 text-sm"
          >
            <div class="flex flex-wrap gap-x-4 gap-y-1">
              <th:block th:replace="~{modules/layout :: siteLinks}" />
            </div>
          </nav>
        </div>
      </header>

      <main id="plugin-page-content" data-plugin-page-layout tabindex="-1" class="min-w-0 flex-1">
        <th:block th:replace="${content}" />
      </main>

      <footer class="terminal-shell-footer text-terminal-dim mt-6 flex flex-wrap items-center border-t py-3 text-xs">
        <nav
          th:unless="${showHeader and unixLayout}"
          aria-label="Site navigation"
          class="flex flex-wrap gap-x-4 gap-y-2"
        >
          <th:block th:replace="~{modules/layout :: siteLinks}" />
        </nav>
        <div class="ml-auto">
          &copy; <span th:text="${#dates.year(#dates.createNow())}"></span> <span th:text="${site.title}"></span>
        </div>
      </footer>
    </div>
    <th:block th:if="${theme.config.footer.custom_head}">
      <th:block th:utext="${theme.config.footer.custom_head}"></th:block>
    </th:block>
    <halo:footer />
  </body>
</html>
