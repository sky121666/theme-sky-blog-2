<!doctype html>
<html
  th:lang="${#locale.toLanguageTag}"
  class="terminal-gateway-theme"
  th:fragment="layout (title,head,body)"
  th:with="
    isChinese=${#locale.language == 'zh'},
    isLogin=${authPageType == null or authPageType == 'login'},
    actionTitle=${isLogin ? (isChinese ? '登录' : 'Sign in') :
      (authPageType == 'signup' ? (isChinese ? '注册' : 'Sign up') :
      (authPageType == 'reset' ? (isChinese ? '重置密码' : 'Reset password') : (isChinese ? '退出登录' : 'Sign out')))},
    actionCommand=${isLogin ? 'login' : (authPageType == 'signup' ? 'signup' : (authPageType == 'reset' ? 'passwd --reset' : 'logout'))}"
>
  <head>
    <!-- Basic Metas -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title th:text="${title}"></title>

    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>

    <!-- Halo Basic Resources -->
    <th:block th:replace="~{gateway_fragments/common::basicStaticResources}"></th:block>
    <th:block th:replace="~{modules/theme-style :: palette}" />
  </head>

  <body class="terminal-gateway">
    <div class="terminal-gateway-panel">
      <header class="terminal-gateway-header">
        <div class="terminal-gateway-context">
          <code aria-hidden="true" th:text="|~/auth $ ${actionCommand}|">~/auth $ login</code>
          <span th:text="${site.title}"></span>
        </div>
        <h1 th:text="${actionTitle}">Sign in</h1>
      </header>
      <main class="terminal-gateway-content auth-form-terminal">
        <th:block th:replace="${body}" />
      </main>
    </div>
  </body>
</html>
