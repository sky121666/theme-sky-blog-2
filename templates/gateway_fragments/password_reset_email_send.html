<th:block th:fragment="form">
  <!-- 发送成功后的界面 -->
  <form th:if="${sent}" method="get" action="/login" class="auth-form-terminal">
    <div
      class="terminal-alert border-terminal-green text-terminal-green bg-terminal-green/10 mb-4 border p-3 font-mono text-sm"
    >
      <span class="mr-2 font-bold">[SUCCESS]</span>
      <strong>重置链接已发送到您的邮箱，请查收</strong>
    </div>
    <div class="form-item mt-6">
      <button
        type="submit"
        class="group border-terminal-green text-terminal-green hover:bg-terminal-green hover:text-terminal-black relative flex w-full items-center justify-center overflow-hidden border-2 px-4 py-3 font-bold tracking-widest uppercase transition-all"
      >
        <span class="relative z-10 flex items-center justify-center gap-2 font-mono">
          <span>返回登录</span>
          <span class="transition-transform group-hover:translate-x-1">-&gt;</span>
        </span>
      </button>
    </div>
  </form>

  <!-- 发送表单 -->
  <form
    th:unless="${sent}"
    class="auth-form-terminal"
    th:action="@{/password-reset/email}"
    method="post"
    th:object="${form}"
  >
    <!-- 错误提示 -->
    <div
      class="terminal-alert mb-4 border border-red-500 bg-red-500/10 p-3 font-mono text-sm text-red-500"
      role="alert"
      th:if="${param.error != null and param.error.size() > 0}"
    >
      <span class="mr-2 font-bold">[ERROR]</span>
      <strong th:if="${param.error[0] == 'invalid_reset_token'}">重置链接无效或已过期</strong>
    </div>
    <div
      class="terminal-alert mb-4 border border-red-500 bg-red-500/10 p-3 font-mono text-sm text-red-500"
      role="alert"
      th:if="${error}"
    >
      <span class="mr-2 font-bold">[ERROR]</span>
      <strong th:if="${error == 'rate_limit_exceeded'}">请求过于频繁，请稍后再试</strong>
    </div>

    <!-- Email 输入 -->
    <div class="form-item group mb-4">
      <label
        for="email"
        class="text-terminal-dim group-focus-within:text-terminal-green mb-1 block font-mono text-xs tracking-widest uppercase transition-colors"
      >
        邮箱地址
      </label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autofocus
        th:field="*{email}"
        autocomplete="email"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        placeholder="user@example.com"
      />
      <p
        class="mt-1 font-mono text-xs text-red-500"
        role="alert"
        th:if="${#fields.hasErrors('email')}"
        th:errors="*{email}"
      ></p>
    </div>

    <!-- Altcha Captcha -->
    <div halo:captcha class="form-item-compact my-4 w-full"></div>

    <!-- Submit Button -->
    <div class="form-item mt-6">
      <button
        type="submit"
        class="group border-terminal-green text-terminal-green hover:bg-terminal-green hover:text-terminal-black relative flex w-full items-center justify-center overflow-hidden border-2 px-4 py-3 font-bold tracking-widest uppercase transition-all"
      >
        <span class="relative z-10 flex items-center justify-center gap-2 font-mono">
          <span>发送重置链接</span>
          <span class="transition-transform group-hover:translate-x-1">-&gt;</span>
        </span>
      </button>
    </div>
  </form>
</th:block>
