<!doctype html>
<th:block th:with="authPageType='signup'">
  <html
    xmlns:th="https://www.thymeleaf.org"
    th:replace="~{gateway_fragments/layout :: layout(title = '注册 - ' + ${site.title}, head = null, body = ~{::body})}"
  >
    <th:block th:fragment="body">
      <div class="terminal-login-wrapper w-full">
        <!-- Form Container -->
        <div
          class="terminal-form-box"
          th:with="nativeSignup=${globalInfo != null and (
            (#strings.contains(globalInfo.toString(), 'mustVerifyPhoneOnRegistration=') and globalInfo.mustVerifyPhoneOnRegistration)
            or (#strings.contains(globalInfo.toString(), 'restrictRegistrationDomain=') and globalInfo.restrictRegistrationDomain and globalInfo.mustVerifyEmailOnRegistration == true)
          )}"
        >
          <form
            th:replace="~{__${nativeSignup ? 'gateway_fragments/signup' : 'gateway_fragments/terminal_signup'}__::form}"
          ></form>
          <div th:replace="~{gateway_fragments/common::socialAuthProviders}"></div>
        </div>

        <!-- Footer -->
        <div
          class="border-terminal-green/30 text-terminal-dim mt-6 flex flex-col items-center gap-2 border-t border-dashed pt-4 text-center text-xs"
        >
          <div th:replace="~{gateway_fragments/common::loginNoticeContent}"></div>
          <div th:replace="~{gateway_fragments/common::returnToSiteContent}"></div>
        </div>
      </div>
    </th:block>
  </html>
</th:block>
