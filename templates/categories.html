<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="terminal-file-list terminal-file-list--lean" x-data="fileListNav">
      <h1 class="sr-only" th:text="|Categories - ${site.title}|">Categories</h1>
      <th:block th:replace="~{modules/file-list :: prompt('~/blog/categories')}"></th:block>

      <th:block th:replace="~{modules/file-list :: directories(${categories}, '')}"></th:block>

      <div class="terminal-list-total mt-3"><span th:text="${#lists.size(categories)}">0</span> directories found.</div>
    </div>
  </th:block>
</html>
